<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiter · Flavours Kitchen</title><link rel="stylesheet" href="shared.css">
<style>
 .floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:18px 20px}
 .tb{border-radius:var(--radius);padding:14px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
 .tb b{font-size:18px} .tb.free{border-color:#bfe3cd} .tb.occupied{border-color:var(--amber);background:#fff4e2}
 .tb.ready{border-color:var(--blue);background:#e8f2fb;animation:glow 1.5s infinite} .tb.bill{border-color:var(--purple);background:#f1eafb} .tb.cleaning{border-color:var(--line);opacity:.65}
 @keyframes glow{50%{box-shadow:0 0 0 4px rgba(47,127,196,.25)}}
 .layout{max-width:1240px;margin:0 auto;padding:16px 20px 40px;display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
 .layout>main{min-width:0}
 .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
 .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:10px}
 .dc{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-align:left;border:0;padding:0;font:inherit;color:inherit}
 .dc.off{opacity:.45;pointer-events:none}
 .dc .ph{height:120px;display:grid;place-items:center;font-size:52px;position:relative}
 .dc .tag{position:absolute;left:10px;top:10px;background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
 .dc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
 .dc .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:16px}
 .dc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font-size:13px;color:var(--muted)}
 .add{background:var(--brand);color:#fff;border-radius:10px;padding:7px 16px;font-weight:800;font-size:14px}
 .add{border:0;cursor:pointer}
 .stepper{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:2px;color:var(--text)}.stepper button{width:32px;height:32px;border:0;background:#fff;border-radius:8px;font-size:18px;font-weight:800;cursor:pointer}.stepper b{min-width:14px;text-align:center}
 aside.panel{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:20px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
 .live{display:flex;justify-content:space-between;background:#f3faf5;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;margin:12px 0}
 .live i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:8px}
 .li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
 .li .q{background:var(--panel2);border-radius:8px;padding:3px 8px;font-weight:800;font-size:13px}
 .qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:18px}
 .sum{background:var(--panel2);border-radius:14px;padding:14px;margin:14px 0;display:grid;gap:6px;color:var(--muted)}
 .sum .r{display:flex;justify-content:space-between}.sum .t{color:var(--text);font-weight:800;font-size:20px;margin-top:6px}.sum .t b{color:var(--brand)}
 .big{width:100%;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;cursor:pointer}.big:disabled{opacity:.45;cursor:not-allowed}
 .ready-card{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px}
 @media(max-width:900px){.layout{grid-template-columns:1fr}aside.panel{position:static;max-height:none}}
</style></head><body>
<div class="topbar">
 <div class="brand"><span id="logo"></span>Flavours Kitchen</div>
 <div class="tabs"><button class="tab on" data-v="floor">Floor</button><button class="tab" data-v="ready">Ready <span id="rc" class="pill blue hidden"></span></button><button class="tab" data-v="take">Takeaway</button><button class="tab" data-v="stats">My shift</button></div>
 <div class="grow"></div><span id="conn"></span><span class="muted hide-sm" data-user></span><button class="btn small" data-logout>Sign out</button>
</div>
<div id="main"></div>
<script src="shared.js"></script>
<script>
$('#logo').innerHTML = LOGO;
const EMOJI = { tiffins: '🫓', meals: '🍛', biryanis: '🍚', pulaos: '🍚', juices: '🥤', chat: '🥗', shakes: '🥛', snacks: '🥟', chai: '☕', chinese: '🥡', fish: '🐟', curry: '🍲' };
const TINT = ['#fde9d3', '#e8f3dd', '#fbe3e0', '#e6eefb', '#f6eadb', '#efe6f8'];
const DIETN = { veg: 'Veg', nonveg: 'Non-veg', egg: 'Egg' };
let v = 'floor', cur = null /* {kind:'table'|'take', id} */, cart = [], cat = 'all', q = '', dietF = 'all', lastReady = -1;
$$('[data-v]').forEach((b) => (b.onclick = () => { v = b.dataset.v; if (v === 'take') { cur = { kind: 'take' }; cart = []; v = 'order'; } else cur = null; render(); }));
const S = () => FK.state;
const tname = (id) => (S().tables.find((t) => t.id === id) || { name: id }).name;
const curOrder = () => cur && (cur.kind === 'table' ? S().orders.find((o) => o.tableId === cur.id && o.status === 'open') : cur.orderId && S().orders.find((o) => o.id === cur.orderId));
const stLabel = { free: 'Free', occupied: 'Occupied', ready: 'Food ready', bill: 'Bill requested', cleaning: 'Needs cleaning' };

function render() {
  const s = S(); if (!s) return;
  const readyItems = s.orders.filter((o) => o.status === 'open').flatMap((o) => o.items.filter((i) => i.status === 'ready').map((i) => ({ o, i })));
  $('#rc').textContent = readyItems.length; $('#rc').classList.toggle('hidden', !readyItems.length);
  $$('[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === (v === 'order' ? (cur && cur.kind === 'take' ? 'take' : 'floor') : v)));
  const m = $('#main');
  if (v === 'floor') {
    m.innerHTML = '<div class="floor">' + s.tables.map((t) => {
      const o = s.orders.find((x) => x.id === t.orderId);
      return `<button class="tb ${t.status}" data-t="${esc(t.id)}"><div class="row between"><b>${esc(t.name)}</b><span class="muted">${t.seats}🪑</span></div>
        <div><div class="muted" style="font-size:13px">${stLabel[t.status]}</div>${o ? `<div class="row between"><span>${rs(o.totals.total)}</span><span class="muted">${mins(o.created)}m</span></div>` : ''}</div></button>`;
    }).join('') + '</div>';
    $$('[data-t]', m).forEach((b) => (b.onclick = () => {
      const t = s.tables.find((x) => x.id === b.dataset.t);
      if (t.status === 'cleaning') { if (confirm(`Mark ${t.name} as cleaned?`)) act(api('POST', `/api/tables/${t.id}/clean`)); return; }
      cur = { kind: 'table', id: t.id }; cart = []; v = 'order'; render();
    }));
  } else if (v === 'ready') {
    m.innerHTML = '<div style="padding:14px;display:grid;gap:10px;max-width:700px;margin:auto">' + (readyItems.length ? readyItems.map(({ o, i }) => `<div class="card ready-card"><div>${dietDot(i.diet)} <b>${i.qty} × ${esc(i.name)}</b><div class="muted">${o.type === 'takeaway' ? 'Takeaway ' + esc(o.customer) : esc(tname(o.tableId))} · ready ${mins(i.readyAt)}m ago</div></div><button class="btn green" data-s="${esc(o.id)}|${esc(i.id)}">Served</button></div>`).join('') : '<p class="muted" style="text-align:center;padding:60px 0">Nothing waiting to be served</p>') + '</div>';
    $$('[data-s]', m).forEach((b) => (b.onclick = () => { const [oid, iid] = b.dataset.s.split('|'); act(api('POST', `/api/orders/${oid}/status`, { status: 'served', itemIds: [iid] })); }));
  } else if (v === 'stats') {
    const mine = s.orders.filter((o) => o.waiter === FK.user.name && o.status === 'paid');
    const total = mine.reduce((a, o) => a + o.totals.total, 0);
    m.innerHTML = `<div style="padding:14px;max-width:600px;margin:auto" class="card"><h2>${esc(FK.user.name)}</h2><p class="muted">Last 36 hours</p>
      <div class="row wrap"><div class="card grow"><div class="muted">Orders closed</div><h2>${mine.length}</h2></div><div class="card grow"><div class="muted">Sales</div><h2>${rs(total)}</h2></div></div></div>`;
  } else if (v === 'order') renderOrder(m);
}

function renderOrder(m) {
  const s = S(), o = curOrder(), st = s.settings;
  if (cat !== 'all' && !s.categories.find((c) => c.id === cat)) cat = 'all';
  const ql = q.trim().toLowerCase();
  const list = s.menu.filter((x) => (dietF === 'all' || x.diet === dietF) && (cat === 'all' || x.categoryId === cat) && (!ql || x.name.toLowerCase().includes(ql)));
  const cnt = (d) => s.menu.filter((x) => d === 'all' || x.diet === d).length;
  const title = cur.kind === 'take' ? 'Takeaway' : tname(cur.id);
  const live = o ? o.items.filter((i) => i.status !== 'void') : [];
  const sub = cart.reduce((a, c) => a + c.price * c.qty, 0) + (o ? o.totals.subtotal : 0);
  const sv = Math.round(sub * st.serviceChargePercent) / 100, gst = Math.round((sub + sv) * st.gstPercent) / 100, total = Math.round(sub + sv + gst);
  const n = cart.reduce((a, c) => a + c.qty, 0);
  const card = (x) => {
    const ci = s.categories.findIndex((c) => c.id === x.categoryId), qty = cart.filter((c) => c.menuId === x.id).reduce((a, c) => a + c.qty, 0);
    return `<div class="dc ${x.available ? '' : 'off'}"><div class="ph" style="background:${TINT[ci % TINT.length]}">${EMOJI[x.categoryId] || '🍽'}<span class="tag"><span class="diet ${x.diet}"></span>${DIETN[x.diet]}</span></div>
      <div class="bd"><div class="top"><span>${esc(x.name)}</span><span>${rs(x.price)}</span></div>
      <div class="ft"><span>${esc((s.categories.find((c) => c.id === x.categoryId) || {}).name)}</span>${!x.available ? '<span class="pill red">Out</span>' : qty ? `<span class="stepper"><button data-sub="${esc(x.id)}" aria-label="Remove one">−</button><b>${qty}</b><button data-d="${esc(x.id)}" aria-label="Add one">+</button></span>` : `<button class="add" data-d="${esc(x.id)}">+ Add</button>`}</div></div></div>`;
  };
  const groups = cat === 'all' && !ql ? s.categories : [{ id: '_', name: ql ? 'Results' : (s.categories.find((c) => c.id === cat) || {}).name }];
  const sections = groups.map((c) => {
    const l = c.id === '_' ? list : list.filter((x) => x.categoryId === c.id);
    return l.length ? `<div class="eyebrow" style="margin-top:18px">${esc(c.name)}</div><div class="cards">${l.map(card).join('')}</div>` : '';
  }).join('');
  m.innerHTML = `<div class="layout"><main>
    <div class="bar"><button class="btn small" id="back">← Floor</button><span class="chip" style="cursor:default">🪑 ${esc(title)}</span><input id="q" class="grow" placeholder="Search dishes…" value="${esc(q)}" style="max-width:420px;border-radius:99px"></div>
    <div class="chips">${[['all', 'All Dishes'], ['veg', 'Vegetarian'], ['nonveg', 'Non-Veg'], ['egg', 'Egg']].map(([k, nm]) => `<button class="chip ${dietF === k ? 'on' : ''}" data-f="${k}">${k !== 'all' ? `<span class="diet ${k}"></span>` : ''}${nm} <span class="n">${cnt(k)}</span></button>`).join('')}</div>
    <div class="chips"><button class="chip ${cat === 'all' ? 'on' : ''}" data-c="all">All categories</button>${s.categories.map((c) => `<button class="chip ${cat === c.id ? 'on' : ''}" data-c="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>
    ${sections || '<p class="muted" style="padding:40px 0;text-align:center">No dishes</p>'}
   </main><aside class="panel">
    <div class="row between"><h2 style="font-size:20px">🧾 Current Table Order</h2><span class="chip" style="cursor:default;padding:3px 10px;font-size:12px">${esc(title)}</span></div>
    <div class="live"><span><i></i>Kitchen Active</span><span class="muted">${n} item${n === 1 ? '' : 's'} in cart</span></div>
    ${cur.kind === 'take' && !o ? `<input id="cust" placeholder="Customer name / phone (optional)" value="${esc(cur.customer || '')}" style="margin-bottom:6px">` : ''}
    ${cart.map((c, i) => `<div class="li"><span class="q">${c.qty}x</span><div class="grow"><b>${esc(c.name)}</b><input data-n="${i}" placeholder="Note (less spicy…)" value="${esc(c.note)}" style="margin-top:4px;min-height:32px;padding:4px 8px;font-size:13px"></div>
        <div class="qty"><button data-m="${i}">−</button><button data-p="${i}">+</button></div><b>${rs(c.price * c.qty)}</b></div>`).join('') || (live.length ? '' : '<p class="muted" style="padding:10px 0">Tap dishes to add them.</p>')}
    ${live.length ? `<div class="eyebrow" style="margin:14px 0 2px">Sent to kitchen</div>${live.map((i) => `<div class="li"><span class="q">${i.qty}x</span><div class="grow">${esc(i.name)}${i.note ? `<div class="muted" style="font-size:12px">${esc(i.note)}</div>` : ''}</div><span class="pill ${{ new: 'amber', cooking: 'blue', ready: 'green', served: '' }[i.status]}">${i.status}</span>${['new', 'cooking'].includes(i.status) ? `<button class="btn small red" data-v2="${esc(i.id)}" title="Void item">✕</button>` : ''}</div>`).join('')}` : ''}
    <div class="sum"><div class="r"><span>Subtotal</span><span>${rs(sub)}</span></div><div class="r"><span>GST (${st.gstPercent}%)</span><span>${rs(gst)}</span></div>${st.serviceChargePercent ? `<div class="r"><span>Service Charge (${st.serviceChargePercent}%)</span><span>${rs(sv)}</span></div>` : ''}<div class="r t"><span>Order Total</span><b>${rs(total)}</b></div></div>
    <button class="big" id="send" ${cart.length ? '' : 'disabled'}>Send to Kitchen (${n})</button>
    ${o ? `<div class="row" style="margin-top:10px"><button class="btn grow" id="bill">Bill / Pay</button>${cur.kind === 'table' ? '<button class="btn grow" id="move">Transfer</button>' : ''}</div>` : ''}
   </aside></div>`;
  $('#back').onclick = () => { v = 'floor'; cur = null; render(); };
  $('#q').oninput = (e) => { q = e.target.value; const p = e.target.selectionStart; renderOrder(m); const nn = $('#q'); nn.focus(); nn.setSelectionRange(p, p); };
  $$('[data-f]', m).forEach((b) => (b.onclick = () => { dietF = b.dataset.f; renderOrder(m); }));
  $$('[data-c]', m).forEach((b) => (b.onclick = () => { cat = b.dataset.c; renderOrder(m); }));
  $$('[data-d]', m).forEach((b) => (b.onclick = () => {
    const x = s.menu.find((y) => y.id === b.dataset.d), ex = cart.find((c) => c.menuId === x.id && !c.note);
    if (ex) ex.qty++; else cart.push({ menuId: x.id, name: x.name, price: x.price, diet: x.diet, qty: 1, note: '' }); renderOrder(m);
  }));
  $$('[data-sub]', m).forEach((b) => (b.onclick = () => {
    const i = cart.findIndex((c) => c.menuId === b.dataset.sub); if (i < 0) return;
    if (--cart[i].qty < 1) cart.splice(i, 1); renderOrder(m);
  }));
  $$('[data-p]', m).forEach((b) => (b.onclick = () => { cart[+b.dataset.p].qty++; renderOrder(m); }));
  $$('[data-m]', m).forEach((b) => (b.onclick = () => { const c = cart[+b.dataset.m]; if (--c.qty < 1) cart.splice(+b.dataset.m, 1); renderOrder(m); }));
  $$('[data-n]', m).forEach((i) => (i.onchange = () => (cart[+i.dataset.n].note = i.value)));
  $$('[data-v2]', m).forEach((b) => (b.onclick = () => confirm('Void this item?') && act(api('POST', `/api/orders/${o.id}/status`, { status: 'void', itemIds: [b.dataset.v2] }))));
  const cu = $('#cust'); if (cu) cu.oninput = () => (cur.customer = cu.value);
  $('#send').onclick = async () => {
    try {
      const r = await api('POST', '/api/orders/send', { type: cur.kind === 'take' ? 'takeaway' : 'dinein', tableId: cur.id, customer: cur.customer, items: cart.map((c) => ({ menuId: c.menuId, qty: c.qty, note: c.note })) });
      cart = []; if (cur.kind === 'take') cur.orderId = r.orderId; toast('Sent to kitchen · KOT ' + r.kotNo); await refresh();
    } catch {}
  };
  if ($('#bill')) $('#bill').onclick = () => billModal(o.id);
  if ($('#move')) $('#move').onclick = () => {
    const free = s.tables.filter((t) => t.status === 'free');
    modal(`<h3>Transfer ${esc(tname(cur.id))} to</h3><div class="row wrap" style="margin-top:12px">${free.map((t) => `<button class="btn" data-to="${esc(t.id)}">${esc(t.name)}</button>`).join('') || '<span class="muted">No free tables</span>'}</div>`, (el, close) =>
      $$('[data-to]', el).forEach((b) => (b.onclick = async () => { try { await api('POST', `/api/tables/${cur.id}/transfer`, { to: b.dataset.to }); cur = { kind: 'table', id: b.dataset.to }; close(); await refresh(); } catch {} })));
  };
}

function billModal(orderId) {
  const o = S().orders.find((x) => x.id === orderId); if (!o) return;
  const t = o.totals, st = S().settings;
  modal(`<h3>Bill · ${o.type === 'takeaway' ? 'Takeaway' : esc(tname(o.tableId))}</h3>
   <table class="t" style="margin-top:8px">${o.items.filter((i) => i.status !== 'void').map((i) => `<tr><td>${i.qty} × ${esc(i.name)}</td><td style="text-align:right">${rs(i.price * i.qty)}</td></tr>`).join('')}
   <tr><td class="muted">Subtotal</td><td style="text-align:right">${rs(t.subtotal)}</td></tr>
   ${t.discount ? `<tr><td class="muted">Discount</td><td style="text-align:right">−${rs(t.discount)}</td></tr>` : ''}
   ${t.service ? `<tr><td class="muted">Service ${st.serviceChargePercent}%</td><td style="text-align:right">${rs(t.service)}</td></tr>` : ''}
   <tr><td class="muted">GST ${st.gstPercent}%</td><td style="text-align:right">${rs(t.gst)}</td></tr>
   <tr><td><b>Total</b></td><td style="text-align:right"><b style="font-size:20px;color:var(--brand)">${rs(t.total)}</b></td></tr></table>
   <div class="row" style="margin-top:10px"><input id="disc" type="number" min="0" placeholder="Discount ₹" value="${o.discount || ''}"><button class="btn" id="dbtn">Apply</button></div>
   <div class="row wrap" style="margin-top:12px"><button class="btn grow" id="pr">🖨 Print bill</button><button class="btn grow" id="bp">Browser print</button><button class="btn grow" id="req">Bill requested</button></div>
   <label>Take payment</label><div class="row"><button class="btn green grow" data-pay="cash">Cash</button><button class="btn green grow" data-pay="upi">UPI</button><button class="btn green grow" data-pay="card">Card</button></div>`,
  (el, close) => {
    $('#dbtn', el).onclick = async () => { try { await api('POST', `/api/orders/${o.id}/discount`, { amount: $('#disc', el).value }); await refresh(); close(); billModal(o.id); } catch {} };
    $('#pr', el).onclick = async () => { try { const r = await api('POST', `/api/orders/${o.id}/printbill`); toast(r.queued ? 'Bill sent to printer' : 'No bill printer configured', !r.queued); } catch {} };
    $('#bp', el).onclick = async () => { try { const r = await api('GET', `/api/orders/${o.id}/receipt`); browserPrint(r.text); } catch {} };
    $('#req', el).onclick = () => act(api('POST', `/api/orders/${o.id}/billreq`)).then(() => { toast('Marked: bill requested'); close(); });
    $$('[data-pay]', el).forEach((b) => (b.onclick = async () => {
      if (!confirm(`Take ${rs(t.total)} by ${b.dataset.pay.toUpperCase()}?`)) return;
      try { await api('POST', `/api/orders/${o.id}/pay`, { method: b.dataset.pay, print: true }); toast('Paid · table needs cleaning'); close(); v = 'floor'; cur = null; await refresh(); } catch {}
    }));
  });
}

boot({ roles: ['waiter', 'admin'], onState: (s) => {
  const n = s.orders.flatMap((o) => o.items).filter((i) => i.status === 'ready').length;
  if (lastReady >= 0 && n > lastReady) { toast('🍽 Food is ready to serve'); try { navigator.vibrate && navigator.vibrate(200); } catch {} }
  lastReady = n;
  const typing = document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
  if (!typing && !document.querySelector('.overlay')) render();
} });
</script></body></html>
